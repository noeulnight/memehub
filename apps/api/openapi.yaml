        - Memes
      summary: Inspect your meme while it is uploading or processing
      description:
        Author only. Return a non-deleted meme in any storage status. Use this endpoint to poll
        an individual upload after completion. Return 404 for another author or a deleted meme. Do
        not include raw storage errors or storage credentials.
      x-implementation-status: planned
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Your meme including its current storage and analysis status.
          content:
