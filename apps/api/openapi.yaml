openapi: 3.1.0
info:
  title: Memehub API
  version: 0.1.0
  description: |-
    API contract and next-step design for the Go backend. All paths are relative to /api.

    Each operation has x-implementation-status: implemented, partial, or planned. Partial operations list implemented and planned content types explicitly. Planned operations and planned image extensions are designs, not available endpoints. Implementation status reflects the current checkout.

    Use OIDC login to establish a cookie session; provider tokens are never browser API credentials. For every authenticated mutation, send the service session cookie, matching Origin, and X-CSRF-Token copied from the readable memehub_csrf cookie. No bearer-token API is provided.

    JSON uses snake_case. App-generated failures use {"error":"code"}. Go's unmatched-route and method errors currently use plain text; a JSON fallback is a planned consistency improvement. JSON request bodies are limited to 1 MiB; the current decoder reports oversized or malformed bodies as 400 invalid_json. Unknown JSON fields are rejected, except that the shared create decoder currently accepts and ignores content_revision.

    Public reads expose the shared library only after storage status becomes ready. Author checks return 404 rather than disclose inaccessible resources. PUT replaces all editable text fields; it is not a partial update. Use content_revision to prevent lost updates.

    S3 and OpenAI credentials stay on the server. Clients upload image bytes to signed storage URLs, not through the Go JSON API. Image reservation, verified completion, thumbnails, and signed media access are implemented. AI worker execution is planned; text creation and verified image completion enqueue analysis jobs. Automatic post-upload analysis remains part of the design. Rate limiting and cost quotas are not implemented yet; only the planned manual analysis endpoint declares 429.

    Known implementation follow-ups: the image branches of unified PUT/DELETE meme operations; administrator authorization; asynchronous image deletion; JSON fallback errors; analysis workers that preserve manual content. These are separate implementation work, not changes made by this design.

    Text and image memes share POST /memes, GET /memes/{id}, PUT /memes/{id}, and DELETE /memes/{id}. The content_type discriminator selects the request and response branch. Signed upload transport and completion remain image-specific subresources; there is no separate image creation endpoint.

    All analysis control, history, result inspection, and application endpoints live under /admin/memes/{id}/analyses and require a server-resolved admin role in addition to a valid session. Ordinary members, including the meme author, receive 403 admin_required. Administrators do not need to own the target meme. Check the role before loading analysis data or creating work. A client-provided role, display name, email, or unvalidated OIDC claim must never grant access.

    Administrator authorization is planned, not implemented. Add a trusted server-side role source, such as users.role with a default of user and controlled administrator assignment. New OIDC registrations must not become administrators by default. No self-service role management endpoint is part of this design. Regular author permissions for editing/deleting memes remain unchanged; administrator analysis access does not grant general edit/delete powers.

    Automatic analysis after upload remains enabled. Text creation atomically queues an analysis job; image preparation queues analysis after the verified image becomes ready. These are internal lifecycle actions and do not expose an analysis control API to ordinary users. Future internal workers may apply the first result under the revision and manual-content preservation rules. Public meme responses continue to expose analysis_status and the resulting descriptions and tags. Analysis history, raw suggestions, manual retries, and explicit application are administrator-only.
servers:
  - url: /api
    description: Same-origin API; Astro proxies this path in local development.
tags:
  - name: Health
    description: Process and database health.
  - name: Auth
    description: OIDC login and service sessions.
  - name: Memes
    description: Shared library and author-owned changes.
  - name: Collections
    description: Private user-owned collections of shared memes.
  - name: Uploads
    description: Image reservations, verified completion, and temporary media access.
  - name: Tags
    description: Planned shared tag discovery.
  - name: Admin Analysis
    description: Planned administrator-only OpenAI analysis operations.
security: []
paths:
  /collections:
    get:
      operationId: listCollections
      tags: [Collections]
      summary: List the authenticated user's collections
      description: Orders by created_at DESC, id DESC. Counts and contains_meme exclude deleted or unready memes. Administrators can only access their own collections.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: meme_id
          in: query
          description: Optional meme whose membership is returned as contains_meme on each collection.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Private collection page.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Collection' }
                  next_cursor: { type: [string, 'null'] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: createCollection
      tags: [Collections]
      summary: Create a collection, optionally saving a meme atomically
      description: The owner comes from the session. Names are trimmed, NFC-normalized, limited to 100 Unicode characters, and unique per user. Blank names and control characters are rejected. An optional meme_id must reference a ready, non-deleted shared meme; failure creates no collection.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                meme_id: { type: string, format: uuid }
      responses:
        '201':
          description: Collection created, with a Location header pointing to its detail endpoint.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Collection' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Origin or CSRF validation failed. }
        '404': { description: Meme is absent, deleted, or not ready. }
        '409': { description: collection_name_exists. }
        '415': { description: application_json_required. }
        '422': { description: invalid_collection_name. }
        '500': { $ref: '#/components/responses/InternalError' }
  /collections/{collectionID}:
    parameters:
      - name: collectionID
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getCollection
      tags: [Collections]
      summary: Read an owned collection and its visible meme count
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Collection metadata. contains_meme is false without membership context.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Collection' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Collection does not exist or belongs to another user. }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      operationId: renameCollection
      tags: [Collections]
      summary: Rename an owned collection
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
      responses:
        '204': { description: Collection renamed. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Origin or CSRF validation failed. }
        '404': { description: Collection does not exist or belongs to another user. }
        '409': { description: collection_name_exists. }
        '415': { description: application_json_required. }
        '422': { description: invalid_collection_name. }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      operationId: deleteCollection
      tags: [Collections]
      summary: Delete an owned collection and its memberships, preserving original memes
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204': { description: Collection deleted. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Origin or CSRF validation failed. }
        '404': { description: Collection does not exist or belongs to another user. }
        '500': { $ref: '#/components/responses/InternalError' }
  /collections/{collectionID}/memes/{id}:
    parameters:
      - name: collectionID
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      operationId: saveCollectionMeme
      tags: [Collections]
      summary: Idempotently save a ready shared meme to an owned collection
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204': { description: Meme saved, or already saved. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Origin or CSRF validation failed. }
        '404': { description: Collection is absent or not owned, or meme is absent, deleted, or not ready. }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      operationId: removeCollectionMeme
      tags: [Collections]
      summary: Idempotently remove a meme from an owned collection
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204': { description: Membership removed, or already absent. Original meme is preserved. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Origin or CSRF validation failed. }
        '404': { description: Collection does not exist or belongs to another user. }
        '500': { $ref: '#/components/responses/InternalError' }
  /health/live:
    get:
      operationId: getLiveness
      tags:
        - Health
      summary: Check HTTP process liveness
      description: Check HTTP process liveness
      x-implementation-status: implemented
      security: []
      responses:
        '200':
          description: Process is running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '500':
          $ref: '#/components/responses/InternalError'
  /health/ready:
    get:
      operationId: getReadiness
      tags:
        - Health
      summary: Check database connectivity
      description:
        Current readiness checks database connectivity only; it does not verify migration state
        or external providers.
      x-implementation-status: implemented
      security: []
      responses:
        '200':
          description: Database is reachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /auth/login:
    get:
      operationId: startLogin
      tags:
        - Auth
      summary: Start OIDC login
      description: Navigate the browser here. Sets the HttpOnly memehub_login cookie for
        /api/auth/callback, valid for ten minutes. Redirects to the configured provider with state,
        nonce, and S256 PKCE. No client-provided return URL is accepted.
      x-implementation-status: implemented
      security: []
      responses:
        '302':
          description: Redirect to the trusted OIDC provider.
          headers:
            Location:
              schema:
                type: string
                format: uri
            Set-Cookie:
              schema:
                type: string
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/callback:
    get:
      operationId: completeLogin
      tags:
        - Auth
      summary: Complete OIDC login
      description:
        Provider callback. Requires the matching login cookie and consumes the stored state
        exactly once. Validates ID token signature, issuer, audience, expiration, nonce, and
        applicable azp. Sets HttpOnly memehub_session on /api and readable memehub_csrf on /.
        Cookies use SameSite=Lax and Secure in production. Creates or updates the user by (iss,
        sub), rotates the browser session, and redirects to the configured application root. Never
        returns provider tokens to the frontend.
      x-implementation-status: implemented
      security: []
      responses:
        '303':
          description: Login succeeded. Session cookies issued; redirect to application root.
          headers:
            Location:
              schema:
                type: string
                format: uri
            Set-Cookie:
              schema:
                type: string
                description: Multiple Set-Cookie headers are emitted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
        - name: state
          in: query
          required: true
          schema:
            type: string
            minLength: 43
            maxLength: 43
        - name: code
          in: query
          required: true
          schema:
            type: string
  /auth/me:
    get:
      operationId: getCurrentUser
      tags:
        - Auth
      summary: Get the logged-in user
      description: Get the logged-in user
      x-implementation-status: implemented
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/logout:
    post:
      operationId: logout
      tags:
        - Auth
      summary: Delete the current service session
      description:
        Deletes the server-side session and expires both service cookies. Does not log the user
        out of the upstream OIDC provider.
      x-implementation-status: implemented
      security:
        - sessionCookie: []
      responses:
        '204':
          description: Session deleted; no response body.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRFToken'
  /memes:
    get:
      operationId: listMemes
      tags:
        - Memes
      summary: Search the shared meme library
      description:
        Public endpoint. Includes only ready, non-deleted memes. Orders by created_at DESC, id
        DESC. Returns an empty items array and a nullable next_cursor. The cursor does not create a
        stable snapshot; newly created memes appear on a fresh first page.
      x-implementation-status: implemented
      security: []
      responses:
        '200':
          description: Meme page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
        - name: uploader
          in: query
          description: Exact case-insensitive preferred_username from the configured OIDC issuer. The UI maps a leading @username to this filter. Missing usernames do not match.
          schema:
            type: string
            maxLength: 200
        - name: mine
          in: query
          description: Return only the authenticated user's ready memes. Requires login when true. Combines with text, tag, and uploader filters.
          schema:
            type: boolean
            default: false
        - name: collection
          in: query
          description: Filter to a collection owned by the authenticated user. Requires login; returns 404 for missing or other users' collections. Combines with all existing filters and uses the same meme creation order and cursor.
          schema: { type: string, format: uuid }
        - name: q
          in: query
          description:
            Case-insensitive substring search across title, body, description, OCR text, source
            name, source author, and tag names. Percent and underscore are literal characters.
          required: false
          schema:
            type: string
            maxLength: 200
        - name: content_type
          in: query
          description: Omit to include both types.
          required: false
          schema:
            type: string
            enum:
              - image
              - text
        - name: tag
          in: query
          description:
            Repeat the parameter to require every selected tag, for example tag=work&tag=monday.
            Names use NFC and ASCII lowercase normalization. Current server rejects individual
            values over 200 UTF-8 bytes.
          required: false
          schema:
            type: array
            items:
              type: string
            maxItems: 30
          style: form
          explode: true
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
    post:
      operationId: createMeme
      tags:
        - Memes
      summary: Create a text or image meme
      description: Requires login, matching Origin, and CSRF token. A single endpoint accepts
        content_type=text or content_type=image. Text requests supply body_text and are ready
        immediately. Image requests supply original_filename, mime_type, size_bytes, and sha256 and
        reserve an uploading image meme. Return a flat meme object in both cases; only image
        creation adds upload instructions. Browser PUT bytes to the returned signed URL, then call
        upload-completion. Image creation uses a distinct staging key; original_object_key points to
        the immutable server-only original. Never accept storage keys from clients. Source and
        manual tag fields are shared. Actual file metadata is verified before publication; duplicate
        hashes are advisory. Repeated creation requests create separate memes. Text creation
        atomically queues one automatic OpenAI analysis job. Image creation waits for upload
        completion and verified preparation before automatic analysis is queued. Image preparation runs
        synchronously during completion. AI worker execution remains implementation work. The current shared decoder accepts and ignores content_revision
        on creation; clients should omit it.
      x-implementation-status: implemented
      security:
        - sessionCookie: []
      responses:
        '201':
          description: Text meme saved, or image meme reserved with signed upload instructions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemeCreateResponse'
          headers:
            Location:
              schema:
                type: string
              description:
                Relative path /api/memes/{id}. Until an image is ready, inspect it through
                /api/me/memes/{id}.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '502':
          $ref: '#/components/responses/StorageUnavailable'
        '503':
          $ref: '#/components/responses/StorageUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemeCreate'
            examples:
              text:
                summary: Save a text meme
                value:
                  content_type: text
                  title: Deployment mood
                  body_text: |-
                    When the deployment succeeds
                    but the dashboard turns red.
                  source_url: https://example.com/posts/123
                  source_name: Example Community
                  source_author: Original Creator
                  tags:
                    - deployment
                    - work
              image:
                summary: Reserve an image upload
                value:
                  content_type: image
                  original_filename: monday.png
                  mime_type: image/png
                  size_bytes: 1048576
                  sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
                  title: Monday mood
                  source_url: https://example.com/posts/123
                  tags:
                    - work
      x-implemented-content-types:
        - text
      x-planned-content-types:
        - image
  /memes/{id}:
    parameters:
      - $ref: '#/components/parameters/MemeID'
    get:
      operationId: getMeme
      tags:
        - Memes
      summary: Get a ready meme
      description:
        Public endpoint. Deleted, missing, uploading, processing, and failed memes return 404.
        Use the planned /me/memes endpoint to view your incomplete uploads.
      x-implementation-status: implemented
      security: []
      responses:
        '200':
          description: Ready meme.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meme'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      operationId: replaceMeme
      tags:
        - Memes
      summary: Replace editable text or image meme fields
      description: >-
        Authors and administrators may replace editable fields of ready text or image memes.
        Changing content_type or the image file is not allowed. Full replacement clears omitted
        editable fields and tags. Text requires body_text; image permits extracted_text.
        Both require the current content_revision. Stale revisions return 409.
        Other users and deleted or missing memes return 404.
      x-implementation-status: implemented
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Updated meme.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meme'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemeUpdate'
            example:
              content_type: text
              title: Updated title
              body_text: |-
                Keep the original line breaks.
                Edit the wording here.
              source_name: Example Community
              tags:
                - work
              content_revision: 0
      x-implemented-content-types:
        - text
        - image
    delete:
      operationId: deleteMeme
      tags:
        - Memes
      summary: Soft-delete a text or image meme
      description: >-
        Authors and administrators may soft-delete text or image memes. Sets deleted_at and removes
        the meme from public list, detail, and media endpoints. Original and thumbnail files are
        retained; physical cleanup is not implemented. Previously issued signed URLs remain valid
        until expiration. Missing, already deleted, or unauthorized memes return 404.
      x-implementation-status: implemented
      security:
        - sessionCookie: []
      responses:
        '204':
          description: Meme is no longer visible; no response body.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRFToken'
      x-implemented-content-types:
        - text
      x-planned-content-types:
        - image
  /me/memes:
    get:
      operationId: listOwnMemes
      tags:
        - Memes
      summary: List your memes including incomplete uploads
      description:
        Author-only list. Includes uploading, processing, ready, and failed memes; excludes
        soft-deleted memes. Supports the same cursor ordering and limit as the public list, plus a
        storage status filter. No client-supplied user ID is accepted.
      x-implementation-status: planned
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Your meme page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: status
          in: query
          description: Optional storage status filter.
          required: false
          schema:
            $ref: '#/components/schemas/StorageStatus'
  /memes/{id}/upload-url:
    parameters:
      - $ref: '#/components/parameters/MemeID'
    post:
      operationId: renewUploadURL
      tags:
        - Uploads
      summary: Renew the upload URL for an uploading meme
      description:
        Author only. Re-signs the same reserved key while status=uploading. Returns 409 after
        completion or while processing. Must not overwrite a ready original. Once completion starts,
        preparation freezes the received bytes into a separate immutable server-only key; metadata,
        thumbnails, and AI must use that frozen copy. An old PUT URL can otherwise overwrite its
        staging key until expiration.
      x-implementation-status: implemented
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Renewed upload instructions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignedUpload'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '502':
          $ref: '#/components/responses/StorageUnavailable'
        '503':
          $ref: '#/components/responses/StorageUnavailable'
        '500':
