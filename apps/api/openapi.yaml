            - string
            - 'null'
          description: Opaque cursor; NULL when there is no next page. Keep all filters unchanged when using it.
    SignedUpload:
      type: object
      additionalProperties: false
      required:
        - method
        - url
        - headers
        - expires_at
      properties:
        method:
          type: string
          enum:
            - PUT
        url:
          type: string
          format: uri
        headers:
          type: object
          additionalProperties:
            type: string
          description:
            Send exactly these signed headers to storage. Do not send service session cookies or
            CSRF tokens to storage.
        expires_at:
          type: string
          format: date-time
    JobAccepted:
      type: object
      additionalProperties: false
      required:
        - job_id
        - meme_id
        - status
      properties:
        job_id:
          type: string
          format: uuid
        meme_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - queued
            - processing
            - completed
        status_url:
          type: string
          description: Relative API path to poll. Upload completion points to /api/me/memes/{id};
            administrative analysis points to /api/admin/memes/{id}/analyses/{analysis_id}.
    AnalysisRequest:
      type: object
      additionalProperties: false
      required:
        - content_revision
      properties:
        content_revision:
          type: integer
          format: int64
          minimum: 0
    AnalysisResult:
      type: object
      additionalProperties: false
      required:
        - title
        - description
        - extracted_text
        - tags
      properties:
        title:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 10000
        extracted_text:
          type: string
          description: Image OCR only; empty for text memes.
        tags:
          $ref: '#/components/schemas/TagNames'
    Analysis:
      type: object
      additionalProperties: false
      required:
        - id
        - meme_id
        - status
        - input_revision
        - requested_model
        - response_model
        - result
        - error_code
        - created_at
        - finished_at
      properties:
        id:
          type: string
          format: uuid
        meme_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - queued
            - processing
            - completed
            - failed
        input_revision:
          type: integer
          format: int64
          minimum: 0
        requested_model:
          type: string
        response_model:
          type:
            - string
            - 'null'
        result:
          anyOf:
            - $ref: '#/components/schemas/AnalysisResult'
            - type: 'null'
        error_code:
          type:
            - string
            - 'null'
        created_at:
          type: string
          format: date-time
        finished_at:
          type:
            - string
            - 'null'
          format: date-time
    ApplyAnalysis:
      type: object
      additionalProperties: false
      required:
        - content_revision
        - fields
      properties:
        content_revision:
          type: integer
          format: int64
          minimum: 0
        fields:
          type: array
          items:
            type: string
            enum:
              - title
              - description
              - extracted_text
              - tags
          minItems: 1
          uniqueItems: true
    SignedMedia:
      type: object
      additionalProperties: false
      required:
        - url
        - expires_at
      properties:
        url:
          type: string
          format: uri
        expires_at:
          type: string
          format: date-time
    Media:
      type: object
      additionalProperties: false
      required:
        - original
        - thumbnail
      properties:
        original:
          $ref: '#/components/schemas/SignedMedia'
        thumbnail:
          anyOf:
            - $ref: '#/components/schemas/SignedMedia'
            - type: 'null'
    Tag:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - normalized_name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        normalized_name:
          type: string
    TagList:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
    AnalysisPage:
      type: object
      additionalProperties: false
      required:
        - items
        - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Analysis'
        next_cursor:
          type:
            - string
            - 'null'
          description: Opaque job-history cursor. Keep the meme ID unchanged.
    ImageMemeCreate:
      type: object
      additionalProperties: false
      required:
        - content_type
        - original_filename
        - mime_type
        - size_bytes
        - sha256
      properties:
        content_type:
          type: string
          const: image
        original_filename:
          type: string
          minLength: 1
          maxLength: 255
          example: monday.png
        mime_type:
          type: string
          enum:
            - image/jpeg
            - image/png
            - image/webp
        size_bytes:
          type: integer
          format: int64
          minimum: 1
          description:
            Declared size. The server verifies the actual uploaded size against UPLOAD_MAX_BYTES;
            default 10485760 bytes.
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
          description: Client-declared SHA-256. Verify it against actual bytes before making the meme ready.
        title:
          type: string
          maxLength: 200
          default: ''
        description:
          type: string
          maxLength: 10000
          default: ''
        source_url:
          type: string
          maxLength: 2048
          description: Optional original post URL. Allow HTTP or HTTPS with a host and no embedded
            credentials. Empty input is stored as NULL. Never fetch the URL automatically.
          example: https://example.com/posts/123
        source_name:
          type: string
          maxLength: 200
          example: Example Community
        source_author:
          type: string
          maxLength: 200
          description: Original creator or publisher, separate from the authenticated submitter.
          example: Original Creator
        source_note:
          type: string
          maxLength: 2000
          description: Free-text attribution, including offline sources. Source URL is optional.
        tags:
          $ref: '#/components/schemas/TagNames'
    MemeCreate:
      oneOf:
        - $ref: '#/components/schemas/TextMemeCreate'
        - $ref: '#/components/schemas/ImageMemeCreate'
      discriminator:
        propertyName: content_type
        mapping:
          text: '#/components/schemas/TextMemeCreate'
          image: '#/components/schemas/ImageMemeCreate'
    MemeUpdate:
      oneOf:
        - $ref: '#/components/schemas/TextMemeUpdate'
        - $ref: '#/components/schemas/ImageMemeUpdate'
      discriminator:
        propertyName: content_type
        mapping:
          text: '#/components/schemas/TextMemeUpdate'
          image: '#/components/schemas/ImageMemeUpdate'
    TextMeme:
      allOf:
        - $ref: '#/components/schemas/Meme'
        - type: object
          properties:
            content_type:
              const: text
    ImageMemeCreated:
      type: object
      additionalProperties: false
      required:
        - id
        - created_by
        - created_by_name
        - created_by_username
        - content_type
        - title
        - body_text
        - description
        - extracted_text
        - source_url
        - source_name
        - source_author
        - source_note
        - status
        - analysis_status
        - content_revision
        - created_at
        - updated_at
        - tags
        - upload
      properties:
        id:
          type: string
          format: uuid
        created_by:
          type: string
          format: uuid
        created_by_username:
          type:
            - string
            - 'null'
          description: Current OIDC preferred_username, populated on login.
        created_by_name:
          type:
            - string
            - 'null'
        content_type:
          type: string
          const: image
        title:
          type: string
        body_text:
          type:
            - string
            - 'null'
        description:
          type: string
        extracted_text:
          type: string
        source_url:
          type:
            - string
            - 'null'
        source_name:
          type:
            - string
            - 'null'
        source_author:
          type:
            - string
            - 'null'
        source_note:
          type:
            - string
            - 'null'
        status:
          $ref: '#/components/schemas/StorageStatus'
        analysis_status:
          $ref: '#/components/schemas/AnalysisStatus'
        content_revision:
          type: integer
          format: int64
          minimum: 0
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        tags:
          type: array
          items:
            type: string
        upload:
          $ref: '#/components/schemas/SignedUpload'
    MemeCreateResponse:
      description:
        Flat meme response for both types. Only image creation adds signed upload instructions.
        Text creation keeps the existing response shape.
      oneOf:
        - $ref: '#/components/schemas/TextMeme'
        - $ref: '#/components/schemas/ImageMemeCreated'
      discriminator:
        propertyName: content_type
        mapping:
          text: '#/components/schemas/TextMeme'
          image: '#/components/schemas/ImageMemeCreated'
