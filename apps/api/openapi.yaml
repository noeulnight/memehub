        - $ref: '#/components/parameters/CSRFToken'
  /memes/{id}/upload-completion:
    parameters:
      - $ref: '#/components/parameters/MemeID'
    post:
      operationId: completeImageUpload
      tags:
        - Uploads
      summary: Verify an uploaded image and save its original and thumbnail
      description:
        Author only. Read the staging object with a byte limit and verify its actual size,
        SHA-256, decoded format, and dimensions. Only JPEG, PNG, and WebP are supported. The
        decoded image must not exceed 20 million pixels. Save the verified bytes to a separate
        server-only original key and generate a PNG thumbnail with a maximum edge of 640 pixels.
        Mark ready and queue one automatic OpenAI analysis job in the same database transaction.
        Preparation runs synchronously in this request. Repeated completion of a ready image
        returns the meme without another analysis job. Invalid uploads remain uploading and may
        be retried. A previously issued PUT URL can only modify staging, never the ready original.
      x-implementation-status: implemented
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Verified image saved, or already ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meme'
        '400':
