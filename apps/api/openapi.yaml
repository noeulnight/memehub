    get:
      operationId: getMemeMedia
      tags:
        - Uploads
      summary: Get temporary original and thumbnail URLs
      description:
        Public only for ready, non-deleted image memes. Otherwise return 404. Never expose the
        staging object. The browser uses these URLs for display or download; image clipboard access
        depends on browser support and storage CORS. Previously issued signed URLs expire at
        expires_at and are not instantly revoked by soft deletion.
      x-implementation-status: implemented
      security: []
      responses:
        '200':
          description: Temporary read URLs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Media'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/StorageUnavailable'
        '503':
          $ref: '#/components/responses/StorageUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /search/suggestions:
    get:
      operationId: getSearchSuggestions
      tags:
        - Memes
      summary: Complete user handles or tag names
      description: >-
        Return up to five prefix matches associated with ready, non-deleted memes.
        Users match username or display name within the configured OIDC issuer.
        Tags match their name. Matching is case-insensitive; percent and underscore
        are literal characters. Results use stable name ordering.
      x-implementation-status: implemented
      security: []
      parameters:
        - name: kind
          in: query
          required: true
          schema:
            type: string
            enum: [user, tag]
        - name: q
          in: query
          description: Optional prefix, without the @ or hash marker. Control characters are rejected.
          schema:
            type: string
            maxLength: 200
            default: ''
      responses:
        '200':
          description: Matching candidates.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 5
                    items:
                      type: object
                      required: [value, label]
                      properties:
                        value:
                          type: string
                          description: Username or exact tag name to insert into search.
                        label:
                          type: string
                          description: Display name for users, or the tag name.
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /tags:
    get:
      operationId: suggestTags
      tags:
        - Tags
      summary: Suggest shared tag names
      description:
        Public autocomplete. Return only tags associated with at least one ready, non-deleted
        meme. Order by normalized_name. Do not expose tag names that only occur in incomplete or
        deleted submissions. Shared tag renaming and deletion are outside scope.
      x-implementation-status: planned
      security: []
      responses:
        '200':
          description: Matching tags.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
        - name: q
          in: query
          description: Optional normalized prefix.
          required: false
          schema:
            type: string
            maxLength: 50
        - name: limit
          in: query
          description: Maximum suggestions.
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
  /me/memes/{id}:
