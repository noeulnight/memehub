        '500':
          $ref: '#/components/responses/InternalError'
  /admin/memes/{id}/analyses:
    parameters:
      - $ref: '#/components/parameters/MemeID'
    post:
      operationId: requestAnalysis
      tags:
        - Admin Analysis
      summary: Request analysis or retry a failed analysis
      description:
        Administrator only. Administrators may operate on any non-deleted meme, regardless of
        its author. Require a ready, non-deleted meme and matching content_revision. Reject with 409
        if an analysis is already queued or processing; do not spend on duplicate jobs. Create a new
        job for a retry rather than overwriting history. Choose the OpenAI model and prompt on the
        server. First-analysis automatic application fills only blank generated fields and adds AI
        tags without replacing manual tags, and requires the same revision. Reanalysis produces
        suggestions for explicit application. Never overwrite body_text or attribution. Quota and
        cost policies must be implemented before opening this endpoint broadly.
      x-implementation-status: planned
      security:
        - sessionCookie: []
      responses:
        '202':
          description: New analysis queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAccepted'
          headers:
            Location:
              schema:
                type: string
              description: Relative path /api/admin/memes/{id}/analyses/{analysis_id}.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminMutationForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalysisRequest'
      x-required-role: admin
    get:
      operationId: listAnalyses
      tags:
        - Admin Analysis
      summary: List a meme analysis history
      description:
        Administrator only. Administrators may operate on any non-deleted meme, regardless of
        its author. This is how administrators discover the analysis job automatically queued by
        text creation or image preparation. Return analyze_content jobs only, newest first by
        created_at and id. Include validated suggestions and safe error codes, with the same
        administrator-only privacy rules as getAnalysis. Polling this endpoint never starts work.
      x-implementation-status: planned
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Analysis history page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
      x-required-role: admin
  /admin/memes/{id}/analyses/{analysis_id}:
    parameters:
      - $ref: '#/components/parameters/MemeID'
      - $ref: '#/components/parameters/AnalysisID'
    get:
      operationId: getAnalysis
      tags:
        - Admin Analysis
      summary: Poll an analysis and inspect its suggestions
      description:
        Administrator only. Administrators may operate on any non-deleted meme, regardless of
        its author. Match both meme ID and analysis job ID; the job must be type=analyze_content.
        Return safe error codes and validated output only. Never return raw OpenAI responses,
        credentials, lease tokens, or provider request IDs. Polling does not start another analysis.
      x-implementation-status: planned
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Analysis status and optional result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Analysis'
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
              description: Suggested polling delay while queued or processing, in seconds.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
      x-required-role: admin
  /admin/memes/{id}/analyses/{analysis_id}/application:
    parameters:
      - $ref: '#/components/parameters/MemeID'
      - $ref: '#/components/parameters/AnalysisID'
    post:
      operationId: applyAnalysis
      tags:
        - Admin Analysis
      summary: Apply selected AI suggestions
      description:
        Administrator only. Administrators may operate on any non-deleted meme, regardless of
        its author. Require completed analysis, a ready non-deleted meme, the current
        content_revision, and unchanged analysis input. Lock the meme, check the revision and job
        input_revision, apply selected fields, and increment revision in one transaction. Return 409
        when any check fails; request a new analysis if its input is stale. Tags are merged, not
        replaced; existing manual associations stay manual and newly accepted AI tags become user
        tags. Reject extracted_text for text memes. Never apply body_text or source fields.
        Replaying the same revision returns 409, preventing a second application.
      x-implementation-status: planned
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Meme after applying selected suggestions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meme'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminMutationForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyAnalysis'
            example:
              content_revision: 2
              fields:
                - description
                - tags
      x-required-role: admin
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: memehub_session
      description:
        Opaque HttpOnly cookie issued after validated OIDC login. Database stores only its
        SHA-256 hash. Secure in production; SameSite=Lax.
  parameters:
    MemeID:
      name: id
      in: path
      required: true
      description: Meme UUID.
      schema:
        type: string
        format: uuid
    AnalysisID:
      name: analysis_id
      in: path
      required: true
      description: Analysis job UUID belonging to the meme.
      schema:
        type: string
        format: uuid
    Origin:
      name: Origin
      in: header
      required: true
      description: Must equal APP_BASE_URL exactly. Browsers send this automatically for mutation requests.
      schema:
        type: string
        format: uri
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Copy the readable memehub_csrf cookie into this header. The token is bound to the
        server-side session.
      schema:
        type: string
        minLength: 43
        maxLength: 43
    Limit:
      name: limit
      in: query
      description: Maximum number of memes in a page.
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Cursor:
      name: cursor
      in: query
      description: Opaque continuation cursor. Reuse with the same filters.
      required: false
      schema:
        type: string
        maxLength: 512
  responses:
    BadRequest:
      description: Malformed request or invalid query parameter.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: invalid_json
    Unauthorized:
      description: Missing or expired login session; OIDC validation failure for callback requests.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: login_required
    Forbidden:
      description: Origin or CSRF token validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: invalid_csrf_token
    NotFound:
      description: Resource does not exist, was deleted, or is not accessible to the caller.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: meme_not_found
    Conflict:
      description: Revision mismatch or an incompatible resource or job state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: revision_conflict
    UnsupportedMediaType:
      description: 'A JSON request requires Content-Type: application/json.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: application_json_required
    UnprocessableContent:
      description: Request values violate content validation rules.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: invalid_body_text
    TooManyRequests:
      description: Planned request or analysis quota exceeded. This response is not implemented yet.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: rate_limit_exceeded
      headers:
        Retry-After:
          description: Seconds until another attempt is allowed.
          schema:
            type: integer
            minimum: 1
    InternalError:
      description: Internal failure. Response and logs must not disclose credentials or raw provider errors.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: internal_error
    StorageUnavailable:
      description: Object storage is unavailable or not configured.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: storage_unavailable
    ServiceUnavailable:
      description: Database is unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: database_unavailable
    AdminRequired:
      description:
        The session is valid but the caller is not an administrator. Resource ownership does
        not grant analysis access.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: admin_required
    AdminMutationForbidden:
      description: A valid non-admin session receives admin_required. Invalid Origin or CSRF token
        receives invalid_csrf_token. Meme ownership does not grant administrative analysis access.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            admin:
              value:
                error: admin_required
            csrf:
              value:
                error: invalid_csrf_token
  schemas:
    Collection:
      type: object
      required: [id, name, created_at, updated_at, meme_count, contains_meme]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 100 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        meme_count: { type: integer, format: int64, minimum: 0 }
        contains_meme: { type: boolean }
    Error:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: string
          description: Stable machine-readable error code. Do not display raw provider or database errors.
    Health:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
