services:
  db:
    image: pgvector/pgvector:pg18@sha256:c29f30688a9ad961691bdf0ec1650717cc132a5814619d80f80463d6e4c42e47
    environment:
      POSTGRES_DB: memehub
      POSTGRES_USER: memehub
      POSTGRES_PASSWORD: change-me
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U memehub -d memehub']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
